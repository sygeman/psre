schema: '../api/schema.gql'
documents:
  - 'src/modules/**/!(*.generated).{ts,tsx}'
generates:
  src/types/gql.types.ts:
    plugins:
      - 'typescript'
  src:
    preset: near-operation-file
    presetConfig:
      baseTypesPath: '~@/types/gql.types'
      extension: '.gql.types.ts'
    plugins:
      - 'typescript-operations'
